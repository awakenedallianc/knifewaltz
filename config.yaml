  - {symbol: "ZB=F", name: 美债30年期货,   cls: futures}

# T2：蓝筹个股——B 档资格线 -60%/250日，从扫描池动态入选（dd250 ≤ -50% 预筛后取全量 OHLCV）
# 扫描池 = S&P 500（sp500.csv 广度池）∪ Nasdaq-100（在线拉取，data/state/ndx100.json 快照兜底）
t2_scan:
  prefilter_dd250: -50    # 预筛（收盘价口径）
  eligible_dd250: -60     # 正式资格线
  max_names: 24

# 美股扩展池与 day_losers 深跌晋升（radar_spec universe.US_扩展池；knives.py / radar_us.py 共用）
us_pool:
  ndx100_url: "https://yfiua.github.io/index-constituents/constituents-nasdaq100.csv"  # CORS=*，101 行 Symbol,Name
  movers_min_mcap: 500000000     # 榜单展示过滤：市值 ≥ 5 亿
  movers_min_price: 2.0          # 且价格 ≥ 2 美元
  movers_min_abs_pct: 10.0       # 且 |当日涨跌| ≥ 10%
  promote_max: 5                 # day_losers 深跌晋升 J1 分诊：每日 ≤ 5 名
  promote_pct: -15.0             # 晋升门槛：当日跌幅 ≤ -15%
  promote_min_mcap: 2000000000   # 且市值 ≥ 20 亿

# 阈值（绝对值 v1；来源：blade_channel_spec.json signal_engine）
thresholds:
  vix_gate: [36, 45, 50]
  term_flip: {red: 1.0, flip_back: 1.05, window_days: 5}
  breadth_90pct: 0.90
  zweig: {from_below: 0.40, to_above: 0.615, within_days: 10}
  fng_gate: 10
  knife_fall: {dd52w: -40, ret10: -15, rsi14: 25}
  index_fall: {dd52w: -20, ret10: -10, rsi14: 30}   # 指数级刀落阈值比个股宽
  # 期货刀落：介于 index_fall(-20) 与 knife_fall(-40) 之间——商品波动大于指数、小于个股崩盘；
  # 6J/6E 外汇腿极少触发属正常（诚实呈现，不为触发而调低）。受 params_registry 预注册网格管辖（RL-9/10）
  futures_fall: {dd52w: -30, ret10: -12, rsi14: 28}
  vol_climax_ratio: 3.0
  crypto_fall: {dd52w: -50, ret10: -20, fund_8h: -0.05}
  b_tier_dd250: -60
  catch_window_days: 10
  cooldown_days: 10

# 日线暴动检测（radar_spec universe.burst_detection.daily_z_score；T1+T1F+T2 全体，heavy/radar 用库内现价算）
burst:
  z1d_abs: 3.0            # |z1d| ≥ 3.0 → 进雷达"日线暴动"表；z1d = ln(C_t/C_{t-1}) / std(最近250根对数收益，不含当日)
  min_bars: 120           # 收益样本不足 120 根不算（显示"历史不足"）
  vol_ratio_confirm: 3.0  # volume/SMA20 ≥ 3.0 为放量确认项；期货无量数据时跳过并标注

# 雷达阈值（radar_spec radar_json_schema.radar_thresholds；随 payload/radar.json 下发，浏览器秒级层前端零硬编码）
radar_thresholds:
  pump_1m_pct: 1.5            # Δ1m ≥ +1.5% → burst 级
  dump_1m_pct: -1.5           # Δ1m ≤ -1.5% → burst 级
  pump_5m_pct: 3.0            # Δ5m ≥ +3.0% → move 级
  dump_5m_pct: -3.0           # Δ5m ≤ -3.0% → move 级
  chg24_board_pct: 10.0       # |24h 涨跌| ≥ 10% 上 24h 榜
  min_quote_vol_usd: 20000000 # quoteVolume ≥ 2000 万美元才参与（防僵尸币假信号）
  funding_warn: 0.0005        # |资金费率| ≥ 0.05%/8h → warn 档
  funding_red: 0.001          # |资金费率| ≥ 0.1%/8h → red 档；≤ -0.1% 且 24h ≤ -10% → 接飞刀候选
  dvol_jump_pct: 15.0         # Deribit DVOL 单日跳升 > 15% → 恐慌放大器旗标

# A 档退出（恐慌反弹交易；持有 ≤ 1 个月）
exits_a:
  - {id: X-STOP, rule: "跌破接刀日最低价 → 全退", plain: 跌破接刀那天的最低价就认错}
  - {id: X-TIME, rule: "15 个交易日收盘未高于接刀价 → 退一半；60 个交易日 → 全退", plain: 一个月还没起来说明判断错了}
  - {id: X-GATE, rule: "市场闸门回到 RED → 全退", plain: 大盘恐慌重新失控时不留恋}
# B 档退出（价值回归仓；目标 36 个月）——时间止损不适用（评审 P0-2）
exits_b:
  - {id: X-LOW,   rule: "收盘创下接刀后的新低 -15% → 全退",     plain: 底不是底，认错}
  - {id: X-DEAD,  rule: "36 个月未收复接刀价 +30% → 清仓复盘",  plain: 三年不涨的价值回归不存在}
  - {id: X-EVENT, rule: "退市警示/违约公告（人工事件）→ 全退",   plain: 基本面死亡事件不等图表}
