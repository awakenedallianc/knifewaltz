  - {symbol: "GC=F", name: 黄金期货,       cls: futures}
  - {symbol: "SI=F", name: 白银期货,       cls: futures}
  - {symbol: "NG=F", name: 天然气期货,     cls: futures}
  - {symbol: "HG=F", name: 铜期货,         cls: futures}
  - {symbol: "PL=F", name: 铂金期货,       cls: futures}
  - {symbol: "ZC=F", name: 玉米期货,       cls: futures}
  - {symbol: "ZS=F", name: 大豆期货,       cls: futures}
  - {symbol: "ZW=F", name: 小麦期货,       cls: futures}
  - {symbol: "CT=F", name: 棉花期货,       cls: futures}
  - {symbol: "KC=F", name: 咖啡期货,       cls: futures}
  - {symbol: "SB=F", name: 糖期货,         cls: futures}
  - {symbol: "CC=F", name: 可可期货,       cls: futures}
