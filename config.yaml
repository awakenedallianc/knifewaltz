# T1C：信用 ETF 6 条（depth_spec 裁决 D2）——信用面暴动=违约概率重定价：HYG/BKLN 崩=企业信用收缩
# （BKLN 浮息，与 HYG 背离可分离利率因子），PFF 崩=银行资本结构承压（优先股是银行危机温度计），
# EMB 崩=主权美元债危机，LQD-IEF 差走阔=投资级信用溢价——信用先于股票认输。
# cls=credit_etf（engine.detect 走 thresholds.credit_fall）；A 档 + B 档（B 资格线 -60 对债 ETF
# 几乎不可达属正常，诚实呈现不调线）。双角色：knives.grab 产出的 k.HYG/k.IEF 序列同时供 engine
# 信用代理与 blade_index sev_credit（裁决 D2 死腿复活——这是补缺失数据不是改公式，提交说明必须声明）
t1c:
  - {symbol: LQD,  name: 投资级公司债ETF, cls: credit_etf}
  - {symbol: BKLN, name: 银行贷款ETF,     cls: credit_etf}
  - {symbol: PFF,  name: 优先股ETF,       cls: credit_etf}
  - {symbol: EMB,  name: 新兴市场美元债ETF, cls: credit_etf}
  - {symbol: HYG,  name: 高收益债ETF,     cls: credit_etf}
  - {symbol: IEF,  name: 美债7-10年ETF,   cls: credit_etf}

# T2：蓝筹个股——B 档资格线 -60%/250日，从扫描池动态入选（dd250 ≤ -50% 预筛后取全量 OHLCV）
# 扫描池 = S&P 500（sp500.csv 广度池）∪ Nasdaq-100（在线拉取，data/state/ndx100.json 快照兜底）
t2_scan:
  prefilter_dd250: -50    # 预筛（收盘价口径）
  eligible_dd250: -60     # 正式资格线
  max_names: 24

# 美股扩展池与 day_losers 深跌晋升（radar_spec universe.US_扩展池；knives.py / radar_us.py 共用）
us_pool:
  ndx100_url: "https://yfiua.github.io/index-constituents/constituents-nasdaq100.csv"  # CORS=*，101 行 Symbol,Name
  movers_min_mcap: 500000000     # 榜单展示过滤：市值 ≥ 5 亿
  movers_min_price: 2.0          # 且价格 ≥ 2 美元
  movers_min_abs_pct: 10.0       # 且 |当日涨跌| ≥ 10%
  promote_max: 5                 # day_losers 深跌晋升 J1 分诊：每日 ≤ 5 名
  promote_pct: -15.0             # 晋升门槛：当日跌幅 ≤ -15%
  promote_min_mcap: 2000000000   # 且市值 ≥ 20 亿

# 阈值（绝对值 v1；来源：blade_channel_spec.json signal_engine）
thresholds:
  vix_gate: [36, 45, 50]
  term_flip: {red: 1.0, flip_back: 1.05, window_days: 5}
  breadth_90pct: 0.90
  zweig: {from_below: 0.40, to_above: 0.615, within_days: 10}
  fng_gate: 10
  knife_fall: {dd52w: -40, ret10: -15, rsi14: 25}
  index_fall: {dd52w: -20, ret10: -10, rsi14: 30}   # 指数级刀落阈值比个股宽
  # 期货刀落：介于 index_fall(-20) 与 knife_fall(-40) 之间——商品波动大于指数、小于个股崩盘；
  # 6J/6E 外汇腿极少触发属正常（诚实呈现，不为触发而调低）。受 params_registry 预注册网格管辖（RL-9/10）
  futures_fall: {dd52w: -30, ret10: -12, rsi14: 28}
  # 行业 ETF 刀落（T1S，裁决 D1）：介于 index_fall(-20) 与 knife_fall(-40) 之间——行业篮子
  # 波动大于宽基、小于个股崩盘。受 params_registry 预注册网格管辖（RL-9/10，登记归 integrator）
  sector_fall: {dd52w: -30, ret10: -12, rsi14: 28}
  # 信用 ETF 刀落（T1C，裁决 D2）：债 ETF 的 -15% 已是危机级
  credit_fall: {dd52w: -15, ret10: -8, rsi14: 30}
  vol_climax_ratio: 3.0
  crypto_fall: {dd52w: -50, ret10: -20, fund_8h: -0.05}
  b_tier_dd250: -60
  catch_window_days: 10
  cooldown_days: 10

